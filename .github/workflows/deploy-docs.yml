name: Deploy user guide

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "marine life ontology/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Generate pyLODE vocabulary HTML
        run: |
          python -m venv /tmp/pylode-venv
          /tmp/pylode-venv/bin/pip install -r "marine life ontology/docs/requirements.txt"
          /tmp/pylode-venv/bin/python "marine life ontology/docs/generate.py"

      - name: Build MkDocs site
        run: mkdocs build

      - name: Export ontology static visualizer into site
        run: |
          pip install "rdflib>=7,<8"
          python "marine life ontology/scripts/export_github_pages.py" --out site/ontology

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

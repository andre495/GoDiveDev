# Test Selection Map
# Maps changed file paths to test suites for selective CI runs.
#
# Format:
#   - pattern: glob pattern to match changed files
#     suites: list of test class names (without .swift extension)
#
# Special behaviors:
#   - "FULL" as a suite name triggers the full test suite
#   - Paths matching multiple patterns get all their suites combined
#   - Unmapped paths trigger FULL suite (fail-safe)
#   - Core paths always trigger FULL suite
#
# To add a mapping:
#   1. Add a pattern matching your file paths
#   2. List the relevant test classes
#   3. Run `ci/select-tests.sh --self-test` to verify

# =============================================================================
# CORE PATHS - Always run full suite
# =============================================================================
core_paths:
  - "GoDiveMVP.xcodeproj/**"
  - "GoDiveMVP/Data/AccountSession*.swift"
  - "GoDiveMVP/Data/GoDiveFirebase*.swift"
  - "GoDiveMVP/Data/AppModelContainer.swift"
  - "GoDiveMVP/Data/AppLaunch*.swift"
  - "GoDiveMVP/Models/**"
  - "GoDiveMVPTests/GoDiveMVPTestSupport.swift"
  - "GoDiveMVPTests/FishialAPITestSupport.swift"
  - ".github/workflows/ios-ci.yml"
  - "ci/**"

# =============================================================================
# PATH TO SUITE MAPPINGS
# =============================================================================
mappings:
  # Account & Auth
  - pattern: "GoDiveMVP/Data/Account*.swift"
    suites:
      - AccountOnboardingTests
      - AccountSyncStateTests

  - pattern: "GoDiveMVP/Data/ReturningAccount*.swift"
    suites:
      - AccountOnboardingTests
      - AccountSyncStateTests

  - pattern: "GoDiveMVP/Views/Pages/sign_in.swift"
    suites:
      - AccountOnboardingTests

  # Dive Activities
  - pattern: "GoDiveMVP/Data/DiveActivity*.swift"
    suites:
      - DiveActivityLogbookTests
      - DiveActivityMediaTests
      - DiveActivityOverviewTests

  - pattern: "GoDiveMVP/Views/Pages/dive_activity*.swift"
    suites:
      - DiveActivityLogbookTests
      - DiveActivityOverviewTests

  - pattern: "GoDiveMVP/Views/Pages/logbook.swift"
    suites:
      - DiveActivityLogbookTests

  # Snorkel Activities
  - pattern: "GoDiveMVP/Data/SnorkelActivity*.swift"
    suites:
      - SnorkelActivityTests

  - pattern: "GoDiveMVP/Views/Pages/snorkel*.swift"
    suites:
      - SnorkelActivityTests

  # Buddies
  - pattern: "GoDiveMVP/Data/DiveBuddy*.swift"
    suites:
      - DiveBuddyTests
      - BuddyFeedTests

  - pattern: "GoDiveMVP/Data/GoDiveBuddy*.swift"
    suites:
      - DiveBuddyTests
      - BuddyFeedTests

  - pattern: "GoDiveMVP/Views/Pages/buddy*.swift"
    suites:
      - DiveBuddyTests
      - BuddyFeedTests

  # Friends & Social
  - pattern: "GoDiveMVP/Data/GoDiveFriend*.swift"

  # Test files map to themselves
  - pattern: "GoDiveMVPTests/AccountOnboardingTests.swift"
    suites: [AccountOnboardingTests]
  - pattern: "GoDiveMVPTests/AccountSyncStateTests.swift"
    suites: [AccountSyncStateTests]

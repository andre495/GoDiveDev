      - GoDiveFriendsMiscTests
      - FriendSharedMediaTests

  - pattern: "GoDiveMVP/Data/GoDiveShared*.swift"
    suites:
      - GoDiveSharedProjectionTests
      - FriendSharedMediaTests

  - pattern: "GoDiveMVP/Views/Pages/friends*.swift"
